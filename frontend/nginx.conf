# HORUS frontend (nginx). Serves the Vite build as an SPA and proxies
# all /api/* traffic to the backend container (service name `backend`).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Long-cache hashed build assets; never cache the entry HTML.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store";
  }

  # Backend API (keeps the /api prefix the app expects).
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
  }

  # SPA fallback: React Router handles all other routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
